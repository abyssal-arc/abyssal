name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # The web client is dependency-free ES modules; parse it as ESM so a
      # syntax slip (or a stray top-level await) fails here, not in a browser.
      # Every file the client ships is listed, and
      # `packages/web/test/pure.test.js` fails if a file on disk is not in this
      # list, because a hand-written list is the one place "added a file" can go
      # unrecorded.
      - name: web esm syntax gate
        run: |
          node --input-type=module --check < packages/web/app.js
          node --input-type=module --check < packages/web/i18n.js
          node --input-type=module --check < packages/web/src/geom.js
          node --input-type=module --check < packages/web/src/format.js
          node --input-type=module --check < packages/web/src/census.js
          node --input-type=module --check < packages/web/src/deeplink.js
          node --input-type=module --check < packages/web/src/since.js
          node --input-type=module --check < packages/web/src/worldsince.js
          node --input-type=module --check < packages/web/src/observe.js
      - run: npm test
