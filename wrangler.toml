name = "abyssal"
main = "packages/server/src/worker.ts"
compatibility_date = "2026-09-01"

# No `routes` in this file, on purpose. www.abyssal-arc.com reaches the worker
# through DNS records managed at the account level, and declaring the hostname
# here as a custom domain makes the API refuse the entire deploy:
#
#   Hostname 'www.abyssal-arc.com' already has externally managed DNS records
#   (A, CNAME, etc). Delete them first or try a different hostname. [100117]
#
# An earlier revision kept a `routes` block down under `[triggers]`, where TOML
# turned it into `triggers.routes`: wrangler warned "Unexpected fields found in
# triggers field" and ignored it, so deploys kept succeeding by accident rather
# than by design. The binding lives in the Cloudflare account, not in this file.

# The web client ships as Workers Static Assets; any path that is not a file
# falls through to the Worker and routes into the Durable Object.
[assets]
directory = "./packages/web"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "AbyssalWorld"

[[migrations]]
tag = "v1"
# Free-plan Durable Objects require the sqlite backend.
new_sqlite_classes = ["AbyssalWorld"]

# Keeps the ecosystem ticking with zero viewers; per-request catchUp covers
# the gaps between alarms.
[triggers]
crons = ["* * * * *"]

# Deployed ABYS contract on Arc mainnet (public information; a proxy whose
# implementation answers decimals() = 18, which the offer math reads live).
[vars]
ABYS_TOKEN_ADDRESS = "0x347ef48695eb437cf9e7e3df8637866f9baf1767"
